name: 北海道降雪提醒

"on":
  schedule:
    # GitHub 的 cron 实际会被压到约每小时一次（实测 */30 平均间隔 66 分钟），
    # 所以改成整点触发，再在 job 内部每 5 分钟检查一次，把延迟压到 5 分钟内。
    # GitHub cron 用 UTC；整点与时区无关，脚本内部按东京时间判断。
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制推送一条测试通知（验证 Bark 是否通了）"
        type: boolean
        default: false
      simulate:
        description: "模拟某个城市刚开始下雪（填城市名，如 函館）"
        type: string
        default: ""
      fallback:
        description: "强制走备用数据源（wttr.in），用于测试降级通知"
        type: boolean
        default: false
      loop_minutes:
        description: "覆盖循环时长（分钟），留空则定时=55、手动=0（只跑一次）"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: snow-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: 取仓库代码
        uses: actions/checkout@v4

      - name: 恢复状态（去重记录 + 旧读数）
        uses: actions/cache@v4
        with:
          path: .snow_state.json
          key: snow-state-${{ github.run_id }}
          restore-keys: |
            snow-state-

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 逐次检查小樽 / 函館 是否开始下雪
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          FORCE_PUSH: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
          SIMULATE_CITY: ${{ github.event.inputs.simulate }}
          FORCE_FALLBACK: ${{ github.event.inputs.fallback == 'true' && '1' || '0' }}
          # 手动触发默认只跑一次（方便测试）；定时触发循环 55 分钟
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || (github.event_name == 'schedule' && '55' || '0') }}
          CHECK_INTERVAL: "300"
        run: python snow_alert.py
